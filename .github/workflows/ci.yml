name: CI

# Runs on every PR into dev/main and on direct pushes to those branches.
# The actual steps live in ci-reusable.yml so cd.yml can run the exact same
# checks before it deploys anything.
on:
  pull_request:
    branches: [ main, dev ]
  # Lets cd.yml run this same build+test+docker-build job as its first gate,
  # instead of duplicating it — mirrors goride-identity-auth's ci-reusable.yml.
  workflow_call:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GoRide.Trip.sln

      - name: Build
        run: dotnet build GoRide.Trip.sln --no-restore --configuration Release

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-reusable.yml
