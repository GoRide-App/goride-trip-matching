name: CD

# Deploys this service to Azure Container Apps on every push to dev.
# Flow: full CI -> build image -> push to GHCR -> update the container app -> check /health.
#
# Why GHCR and not the Azure registry: goride-env is an Azure Container Apps "Express"
# environment (the only kind our student subscription allows), and Express apps can't
# log in to a private registry. So the image is published as a public GitHub package
# and Azure pulls it without credentials. Nothing secret goes into the image: it is
# built from a clean checkout, and passwords live on the container app as secrets.
#
# It does nothing until the repo variable CD_ENABLED is "true". See README, "CI/CD".
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/goride-app/goride-trip-matching
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}

# Explicit bash = `bash -eo pipefail`, same as ci-reusable.yml.
defaults:
  run:
    shell: bash

jobs:
  # 1. Same checks as a PR. Nothing gets built for Azure if these fail.
  ci:
    name: CI
    uses: ./.github/workflows/ci-reusable.yml
    permissions:
      contents: read

  # 2. Build the image and push it to GHCR, tagged with the commit SHA.
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: ci
    if: vars.CD_ENABLED == 'true'
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links the package to this repo on GitHub.
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:dev" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

  # 3. Point the container app at the new image and check it actually comes up.
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      id-token: write # OIDC login to Azure, no password stored in GitHub
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # DB, CORS and Kafka settings are set once on the container app itself
      # (Db__Password as an app secret), so a deploy only swaps the image.
      - name: Deploy image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            -o none

      - name: Check /health
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Checking https://$FQDN/health"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o body.txt -w "%{http_code}" "https://$FQDN/health" || true)
            if [ "$CODE" = "200" ]; then
              cat body.txt; echo
              echo "Service is healthy."
              exit 0
            fi
            echo "attempt $i/12: HTTP $CODE, waiting 10s..."
            sleep 10
          done
          echo "Last response:"; cat body.txt 2>/dev/null || true; echo
          echo "::error title=Deploy unhealthy::/health did not return 200 within 2 minutes. HTTP 500 with \"unhealthy\" usually means the app can't reach MySQL (check the db-password secret on the container app)."
          exit 1

      - name: Deployment summary
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "Deployed \`$IMAGE:${{ github.sha }}\` to **$CONTAINER_APP_NAME**."
          } >> "$GITHUB_STEP_SUMMARY"
